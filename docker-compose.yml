services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: tianming
      POSTGRES_PASSWORD: tianming
      POSTGRES_DB: tianming
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tianming"]
      interval: 5s
      timeout: 3s
      retries: 10

  engine:
    build:
      context: ./services/engine
      args:
        INSTALL_DEV: "false"
    environment:
      TIANMING_DATA_XLSX: /data/thai.xlsx
    volumes:
      - ./data:/data:ro
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
    environment:
      ENGINE_URL: http://engine:8000
      DATABASE_URL: postgresql://tianming:tianming@postgres:5432/tianming
    ports:
      - "3000:3000"
    depends_on:
      - engine

volumes:
  pgdata:
